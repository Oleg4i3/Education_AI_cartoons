<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Освітні мультики-симулятори</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { brand: { 500: '#22c55e', 600: '#16a34a' } } } } }
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search text-xs"></i></span>
      <input type="text" id="searchInput" placeholder="Пошук..." class="bg-slate-100 text-sm text-slate-800 rounded-lg pl-9 pr-4 py-1.5 focus:outline-none focus:ring-2 focus:ring-brand-500 border border-slate-200 w-48 sm:w-64 placeholder-slate-400">
    </div>
    <span id="status" class="text-xs text-slate-400"></span>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  <p id="msg" class="text-sm text-slate-500 text-center py-10"></p>
</main>


<!-- Модаль серіалу: лише список серій -->
<div id="seriesModal" class="hidden fixed inset-0 z-[60] bg-black/60 items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-full flex flex-col overflow-hidden">
    <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-200">
      <div class="min-w-0">
        <div id="smSeries" class="text-[11px] uppercase tracking-wide text-slate-400"></div>
        <h2 id="smTitle" class="font-bold text-base text-slate-900 truncate"></h2>
      </div>
      <button id="smClose" class="shrink-0 w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500" aria-label="Закрити"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="smEps" class="p-3 space-y-2 overflow-y-auto"></div>
  </div>
</div>

<script>
/* ===== Налаштування ===== */
const OWNER = 'Oleg4i3', REPO = 'Education_AI_cartoons';
const EXCLUDE = new Set(['index.html']);                          // файли, які не є мультиками
const TITLE_STRIP = /\s*[—–-]\s*анімована презентація\s*$/i;      // хвіст у <title>, який відрізаємо
const THUMB_W = 480;          // ширина превʼю, px
const END_OFFSET = 0.05;      // за скільки секунд до кінця першої сцени робимо знімок
const FALLBACK_MS = 6000;     // запасний режим: скільки чекати після «кліку» на canvas
const LIST_TTL = 5 * 60e3;    // кеш списку файлів (щоб не впертись у ліміт GitHub API)

/* ===== Утиліти ===== */
const $ = id => document.getElementById(id);
const catalog = $('catalog'), msg = $('msg'), status = $('status');
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const prettify = n => n.replace(/\.html$/i, '').replace(/Cartoon\d*$/i, '').replace(/([a-z])([A-Z])/g, '$1 $2');

/* ===== Список файлів: GitHub API (+ кеш) ===== */
async function listFiles() {
  const c = ls.get('cartoons:list');
  if (c && Date.now() - c.t < LIST_TTL) return c.files;
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
    if (!r.ok) throw new Error('GitHub API ' + r.status);
    const files = (await r.json())
      .filter(f => f.type === 'file' && /\.html$/i.test(f.name) && !EXCLUDE.has(f.name))
      .map(f => ({ name: f.name, sha: f.sha }));
    ls.set('cartoons:list', { t: Date.now(), files });
    return files;
  } catch (e) { if (c) return c.files; throw e; }
}

/* ===== Картка ===== */
function makeCard(f) {
  const el = document.createElement('div');
  el.className = 'group bg-white border border-slate-200 rounded-xl overflow-hidden hover:shadow-md transition flex flex-col';
  const href = encodeURI(f.name);
  el.innerHTML = `
    <a href="${href}" class="pv block aspect-video bg-slate-100 relative border-b border-slate-100 overflow-hidden">
      <div class="ph absolute inset-0 flex items-center justify-center animate-pulse"><i class="fa-solid fa-film text-3xl text-slate-300"></i></div>
    </a>
    <div class="p-4 flex flex-col flex-grow justify-between space-y-3">
      <div class="space-y-1">
        <h3 class="font-bold text-slate-900 text-sm leading-snug line-clamp-2 group-hover:text-brand-600 transition">${esc(prettify(f.name))}</h3>
        <p class="desc hidden text-slate-500 text-xs leading-relaxed line-clamp-3"></p>
      </div>
      <a href="${href}" class="w-full bg-slate-100 hover:bg-brand-600 hover:text-white text-slate-800 font-semibold py-2 rounded-lg text-xs flex items-center justify-center space-x-1.5 transition">
        <i class="fa-solid fa-play text-[10px]"></i><span>Відкрити</span>
      </a>
    </div>`;
  return el;
}
function fill(el, d) {
  el.querySelector('h3').textContent = d.title;
  if (d.desc) { const p = el.querySelector('.desc'); p.textContent = d.desc; p.classList.remove('hidden'); }
  if (d.thumb) el.querySelector('.pv').innerHTML = `<img src="${d.thumb}" alt="" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`;
  else { const ph = el.querySelector('.ph'); if (ph) ph.classList.remove('animate-pulse'); }
}

/* ===== Знімок: кінець першої сцени, без звуку ===== */
const PRELUDE = '<script>HTMLMediaElement.prototype.play=function(){return Promise.resolve()};' +
                'try{speechSynthesis.speak=function(){}}catch(e){}<\/script>';
const raf2 = w => new Promise(r => w.requestAnimationFrame(() => w.requestAnimationFrame(r)));

async function snapshot(name, html) {
  const base = `<base href="${new URL(name, location.href).href}">`;
  const srcdoc = /<head[^>]*>/i.test(html)
    ? html.replace(/<head[^>]*>/i, m => m + base + PRELUDE)
    : base + PRELUDE + html;
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;left:0;top:0;width:960px;height:540px;opacity:0;pointer-events:none;z-index:-1;border:0';
  fr.setAttribute('aria-hidden', 'true'); fr.tabIndex = -1;
  fr.srcdoc = srcdoc;
  const loaded = new Promise((res, rej) => { fr.onload = res; fr.onerror = rej; });
  document.body.appendChild(fr);
  try {
    await Promise.race([loaded, sleep(10000).then(() => { throw new Error('load timeout'); })]);
    const w = fr.contentWindow;
    const g = e => { try { return w.eval(e); } catch (_) { return undefined; } };
    const cv = w.document.querySelector('canvas');
    if (!cv) throw new Error('canvas не знайдено');
    const dur = g('scenes[0].dur');
    if (typeof dur === 'number') {
      g("engine='none'");
      w.eval(`hasStarted=true;currentScene=0;sceneTime=${Math.max(0, dur - END_OFFSET)}`);
      await raf2(w);
    } else {                                   // запасний шлях для нестандартних файлів
      cv.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
      await sleep(FALLBACK_MS);
    }
    const t = document.createElement('canvas');
    t.width = THUMB_W; t.height = Math.round(cv.height * THUMB_W / cv.width);
    const x = t.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, t.width, t.height);
    x.drawImage(cv, 0, 0, t.width, t.height);
    return t.toDataURL('image/jpeg', 0.72);
  } finally { fr.remove(); }
}

async function processOne(f, el) {
  const r = await fetch(f.name);
  if (!r.ok) { el.remove(); return; }           // файл у репо є, на хостингу ще нема
  const html = await r.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const title = (doc.title || prettify(f.name)).replace(TITLE_STRIP, '').trim();
  const desc = (doc.querySelector('meta[name="description"]') || {}).content || '';
  fill(el, { title, desc });
  let thumb = null;
  try { thumb = await snapshot(f.name, html); } catch (e) { console.warn('превʼю:', f.name, e); }
  fill(el, { title, desc, thumb });
  if (thumb) ls.set('cartoon:' + f.name, { sha: f.sha, title, desc, thumb });
}

/* ===== Серіал (папка в репо, всі серії відкриваються в модалі) ===== */
const SERIES = { dir: 'secret', title: 'Серіал' };   // dir — назва папки в репо; title — заголовок картки
const numSort = (a, b) => a.name.localeCompare(b.name, 'uk', { numeric: true });

async function listSeries() {
  const c = ls.get('series:list');
  if (c && Date.now() - c.t < LIST_TTL) return c.files;
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(SERIES.dir)}`);
    if (!r.ok) throw new Error('GitHub API ' + r.status);
    const files = (await r.json())
      .filter(f => f.type === 'file' && /\.html$/i.test(f.name))
      .map(f => ({ name: f.name, path: SERIES.dir + '/' + f.name, sha: f.sha }))
      .sort(numSort);
    ls.set('series:list', { t: Date.now(), files });
    return files;
  } catch (e) { if (c) return c.files; throw e; }
}

const sm = { box: $('seriesModal'), title: $('smTitle'), series: $('smSeries'), eps: $('smEps'), isOpen: false };
let seriesFiles = [];
const epTitles = ls.get('series:titles') || {};

function renderEpisodes() {
  sm.eps.innerHTML = seriesFiles.map((f, j) => `
    <a href="${encodeURI(f.path)}" class="group/ep flex items-center gap-3 px-3 py-2.5 rounded-lg border border-slate-200 hover:border-brand-500 hover:bg-slate-50 transition">
      <span class="w-8 h-8 shrink-0 rounded-full bg-slate-100 group-hover/ep:bg-brand-600 group-hover/ep:text-white text-slate-700 text-sm font-bold flex items-center justify-center transition">${j + 1}</span>
      <span class="ep-t flex-grow text-sm font-semibold text-slate-800 leading-snug">${esc(epTitles[f.path] || 'Серія ' + (j + 1))}</span>
      <i class="fa-solid fa-play text-[10px] text-slate-400 group-hover/ep:text-brand-600"></i>
    </a>`).join('');
}
function openSeries() {
  if (!seriesFiles.length) return;
  sm.title.textContent = SERIES.title;
  sm.series.textContent = `${seriesFiles.length} серій`;
  renderEpisodes();
  sm.box.classList.remove('hidden'); sm.box.classList.add('flex');
  document.body.style.overflow = 'hidden'; sm.isOpen = true;
  seriesFiles.forEach((f, j) => {                    // назви серій підтягуємо з <title>
    if (epTitles[f.path]) return;
    fetch(f.path).then(r => r.ok ? r.text() : '').then(h => {
      const t = (new DOMParser().parseFromString(h, 'text/html').title || '').replace(TITLE_STRIP, '').trim();
      if (!t) return;
      epTitles[f.path] = t; ls.set('series:titles', epTitles);
      const el = sm.eps.querySelectorAll('.ep-t')[j]; if (el) el.textContent = t;
    }).catch(() => {});
  });
}
function closeSeries() {
  sm.box.classList.add('hidden'); sm.box.classList.remove('flex');
  document.body.style.overflow = ''; sm.isOpen = false;
}
$('smClose').onclick = closeSeries;
sm.box.addEventListener('click', e => { if (e.target === sm.box) closeSeries(); });
document.addEventListener('keydown', e => { if (sm.isOpen && e.key === 'Escape') closeSeries(); });

// Створює картку серіалу; повертає функцію, що пізніше робить превʼю з першої серії
async function initSeries() {
  let files;
  try { files = await listSeries(); } catch (e) { console.warn('серіал:', e); return null; }
  if (!files.length) return null;
  seriesFiles = files;
  const el = makeCard({ name: files[0].path });
  el.dataset.series = '1';
  el.classList.add('ring-2', 'ring-brand-500');
  const pv = el.querySelector('.pv'), btn = el.querySelector('.p-4 a');
  [pv, btn].forEach(a => a.addEventListener('click', e => { e.preventDefault(); openSeries(); }));
  btn.querySelector('span').textContent = 'Дивитись серіал';
  btn.querySelector('i').className = 'fa-solid fa-layer-group text-[10px]';
  const badge = document.createElement('span');
  badge.className = 'absolute top-2 left-2 bg-brand-600 text-white text-[11px] font-bold px-2 py-0.5 rounded-full shadow';
  badge.textContent = `Серіал · ${files.length} сер.`;
  const desc = `${files.length} серій — натисніть, щоб обрати серію`;
  const key = 'series:card';
  const c = ls.get(key);
  const sig = files.map(f => f.sha).join(',');
  const paint = thumb => {
    fill(el, { title: SERIES.title, desc, thumb });
    pv.appendChild(badge);
  };
  catalog.prepend(el);
  if (c && c.sig === sig) { paint(c.thumb); return null; }
  paint(null);
  return async () => {
    try {
      const r = await fetch(files[0].path);
      if (!r.ok) return;
      const thumb = await snapshot(files[0].path, await r.text());
      paint(thumb);
      ls.set(key, { sig, thumb });
    } catch (e) { console.warn('превʼю серіалу:', e); }
  };
}

/* ===== Ініціалізація ===== */
function sortCards() {
  [...catalog.children].filter(c => !c.dataset.series)
    .sort((a, b) => a.querySelector('h3').textContent.localeCompare(b.querySelector('h3').textContent, 'uk'))
    .forEach(c => catalog.appendChild(c));
  const sc = catalog.querySelector('[data-series]'); if (sc) catalog.prepend(sc);   // серіал завжди першим
}

async function init() {
  msg.textContent = 'Завантаження каталогу…';
  let files;
  try { files = await listFiles(); }
  catch (e) {
    msg.innerHTML = `Не вдалося отримати список мультиків (${esc(e.message)}). <button id="retry" class="underline">Повторити</button>`;
    $('retry').onclick = init; return;
  }
  msg.textContent = files.length ? '' : '';
  try {                                          // прибрати кеш видалених файлів
    Object.keys(localStorage).filter(k => k.startsWith('cartoon:') && !files.some(f => 'cartoon:' + f.name === k))
      .forEach(k => localStorage.removeItem(k));
  } catch (e) {}

  catalog.innerHTML = '';
  const queue = [];
  files.sort((a, b) => a.name.localeCompare(b.name)).forEach(f => {
    const el = makeCard(f); catalog.appendChild(el);
    const c = ls.get('cartoon:' + f.name);
    if (c && c.sha === f.sha) fill(el, c); else queue.push([f, el]);
  });
  sortCards();
  const seriesThumb = await initSeries();
  sortCards();

  let n = 0;
  for (const [f, el] of queue) {                 // по черзі, щоб не вантажити процесор
    status.textContent = `Готую превʼю: ${++n}/${queue.length}`;
    try { await processOne(f, el); } catch (e) { console.warn(f.name, e); fill(el, { title: prettify(f.name) }); }
  }
  if (seriesThumb) { status.textContent = 'Готую превʼю серіалу…'; await seriesThumb(); }
  status.textContent = '';
  if (queue.length) sortCards();
}

/* ===== Пошук ===== */
$('searchInput').addEventListener('input', e => {
  const term = e.target.value.toLowerCase();
  catalog.querySelectorAll(':scope > div').forEach(card => {
    const t = card.querySelector('h3').textContent.toLowerCase();
    const d = card.querySelector('.desc').textContent.toLowerCase();
    card.style.display = (t.includes(term) || d.includes(term)) ? '' : 'none';
  });
});

init();
</script>
</body>
</html>
