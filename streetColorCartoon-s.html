<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Без Referer: на GitHub Pages неофіційний Google TTS інакше відхиляє запити (з file:// Referer не надсилається) -->
<meta name="referrer" content="no-referrer">
<title>Теорема про розфарбування вулиць — анімована презентація</title>
<style>
:root{--bg:#f6f1e7;--txt:#2c2416;--mut:#6b5d4f;--red:#e11d48}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:18px}
.container{width:100%;max-width:1240px;display:flex;flex-direction:column}
.presentation{width:100%;aspect-ratio:16/9;background:#fff;border:2px solid #d4cfc7;
  border-radius:10px 10px 0 0;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
canvas{width:100%;height:100%;display:block;cursor:pointer}
.scene-indicator{position:absolute;top:14px;right:14px;background:rgba(30,64,175,.92);color:#fff;
  padding:5px 12px;border-radius:5px;font-size:13px;font-weight:bold;pointer-events:none}
.subtitle{position:absolute;left:0;right:0;bottom:10px;width:100%;box-sizing:border-box;
  padding:0 4%;background:transparent;color:#fff;font-weight:bold;
  font-size:clamp(15px,2.1vw,26px);text-align:center;line-height:1.4;
  text-shadow:0 0 3px #000,0 0 6px #000,0 2px 5px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.7);
  transition:opacity .3s;pointer-events:none}
.controls{background:linear-gradient(#241c15,#15100b);border-radius:0 0 10px 10px;padding:6px 14px 12px}
.progress-zone{position:relative;height:40px;cursor:pointer}
.progress-track{position:absolute;left:0;right:0;top:15px;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#e11d48,#f43f5e);border-radius:3px}
.tick{position:absolute;top:11px;width:3px;height:13px;background:rgba(255,255,255,.45);border-radius:2px;transform:translateX(-1px)}
.tick:hover{background:#fff}
.tick.active{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
.tick-label{position:absolute;top:27px;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.62);
  white-space:nowrap;pointer-events:none;font-family:Arial,sans-serif}
.btn-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ctl{background:transparent;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.ctl:hover{background:rgba(255,255,255,.12)}
.ctl svg{width:19px;height:19px;fill:#fff}
.time{color:#fff;font:13px Arial;margin-left:4px;min-width:96px}
.seg{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:none;color:#cfc7ba;padding:5px 10px;font:12px Arial;cursor:pointer}
.seg button+button{border-left:1px solid rgba(255,255,255,.14)}
.seg button.on{background:var(--red);color:#fff}
select{background:#2a221b;color:#eee;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 6px;font:12px Arial}
.chk{display:flex;align-items:center;gap:5px;color:#d9d2c5;font:13px Arial;cursor:pointer;user-select:none}
.chk input{accent-color:var(--red);width:15px;height:15px;cursor:pointer}
.voice{margin-left:auto;color:#fff;font:15px Arial;background:rgba(255,255,255,.1);border-radius:5px;padding:3px 9px}
.voice.active{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.debug-section{margin-top:14px;background:#fff;border:2px solid #d4cfc7;border-radius:8px;padding:14px}
.debug-section h3{font-size:14px;color:var(--mut);margin-bottom:10px}
.scene-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px}
.scene-list button{padding:7px;border:2px solid #d4cfc7;border-radius:6px;background:#fff;color:var(--txt);
  font:12px Georgia;cursor:pointer;text-align:left}
.scene-list button:hover{border-color:#1e40af}
.scene-list button.active{background:#1e40af;color:#fff;border-color:#1e40af}
/* ---- гра «Чарівне слово» ---- */
#gameLayer{--gb:#2563eb;--gr:#dc2626;position:absolute;inset:0;display:none;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  gap:calc(12px*var(--k,1));padding:calc(12px*var(--k,1));background:linear-gradient(#fbf7f0,#f2ebdd);
  font-family:Georgia,'Times New Roman',serif;color:var(--txt)}
#gameLayer.on{display:grid}
.g-graph{position:relative;min-width:0;min-height:0}
#gameCanvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.g-busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:calc(22px*var(--k,1));
  font-weight:bold;color:var(--mut);background:rgba(251,247,240,.85)}
.g-panel{min-width:0;min-height:0;overflow:auto;background:rgba(255,255,255,.93);border:2px solid #d4cfc7;
  border-radius:calc(12px*var(--k,1));padding:calc(12px*var(--k,1)) calc(16px*var(--k,1));display:flex;flex-direction:column;
  gap:calc(9px*var(--k,1));box-shadow:0 4px 14px rgba(0,0,0,.08)}
.g-title{font-size:calc(26px*var(--k,1));font-weight:bold;line-height:1.15}
.g-title:after{content:'';display:block;width:calc(90px*var(--k,1));height:3px;background:var(--red);margin-top:calc(6px*var(--k,1))}
.g-task{font-size:calc(17px*var(--k,1));line-height:1.4}
.g-task .g-t{display:inline-block;min-width:1.8em;text-align:center;background:#f59e0b;color:#fff;border-radius:999px;padding:0 .35em;font-weight:bold}
.g-slots{display:flex;gap:calc(10px*var(--k,1));justify-content:center;margin:calc(2px*var(--k,1)) 0}
.g-slot{width:calc(52px*var(--k,1));height:calc(52px*var(--k,1));border:2px dashed #cbbfae;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:calc(22px*var(--k,1));font-weight:bold;color:#fff;transition:transform .15s}
.g-slot.f{border:3px solid rgba(15,23,42,.35)}
.g-slot.f.B{background:var(--gb)}.g-slot.f.R{background:var(--gr)}
.g-slot.act{transform:scale(1.18);box-shadow:0 0 0 4px rgba(251,191,36,.7)}
.g-keys{display:flex;gap:calc(10px*var(--k,1));justify-content:center}
.g-key{width:calc(54px*var(--k,1));height:calc(54px*var(--k,1));border-radius:50%;border:3px solid rgba(15,23,42,.25);
  font:bold calc(22px*var(--k,1)) Georgia,serif;cursor:pointer;color:#fff;background:#64748b}
.g-key.b{background:var(--gb)}.g-key.r{background:var(--gr)}
.g-key.s{font-size:calc(18px*var(--k,1));background:#e7e1d6;color:#4a3f2e}
.g-key:hover:not(:disabled){filter:brightness(1.1)}.g-key:active:not(:disabled){transform:scale(.94)}
.g-key:disabled{opacity:.4;cursor:default}
.g-row{display:flex;gap:calc(8px*var(--k,1));flex-wrap:wrap;justify-content:center;align-items:center}
.g-go{background:var(--red);color:#fff;border:none;border-radius:calc(9px*var(--k,1));padding:calc(9px*var(--k,1)) calc(26px*var(--k,1));
  font:bold calc(18px*var(--k,1)) Georgia,serif;cursor:pointer;box-shadow:0 3px 0 #9f1239}
.g-go:disabled{opacity:.45;cursor:default;box-shadow:none}
.g-alt{background:#fff;border:2px solid #d4cfc7;border-radius:calc(9px*var(--k,1));padding:calc(7px*var(--k,1)) calc(12px*var(--k,1));
  font:calc(13px*var(--k,1)) Georgia,serif;color:var(--txt);cursor:pointer}
.g-alt:hover:not(:disabled){border-color:#1e40af}.g-alt:disabled{opacity:.45;cursor:default}
.g-status{font-size:calc(15px*var(--k,1));line-height:1.4;min-height:calc(64px*var(--k,1));color:#4a3f2e}
.g-status.win{color:#15803d;font-weight:bold}
.g-status .cb,.g-slot .cb{color:var(--gb)}.g-status .cr{color:var(--gr)}
.g-settings{margin-top:auto;display:flex;flex-wrap:wrap;gap:calc(8px*var(--k,1)) calc(14px*var(--k,1));align-items:center;
  font-size:calc(13px*var(--k,1));color:var(--mut);border-top:1px solid #e7e1d6;padding-top:calc(8px*var(--k,1))}
.g-seg{display:inline-flex;border:1px solid #d4cfc7;border-radius:7px;overflow:hidden;vertical-align:middle;margin-left:4px}
.g-seg button{background:#fff;border:none;padding:calc(4px*var(--k,1)) calc(9px*var(--k,1));font:calc(13px*var(--k,1)) Georgia,serif;cursor:pointer;color:var(--txt)}
.g-seg button+button{border-left:1px solid #d4cfc7}
.g-seg button.on{background:#1e40af;color:#fff}
.scene-list{display:flex!important;flex-direction:column;gap:8px}
.scene-list button{width:100%;padding:10px 12px;line-height:1.5;font:14px Georgia,serif}
.scene-list button b{display:block;font-size:13px;color:#1e40af;margin-bottom:3px}
.scene-list button span{display:block;font-weight:normal;color:#4a3f2e}
.scene-list button.active b,.scene-list button.active span{color:#fff}
</style>
</head>
<body>
<div class="container">
  <div class="presentation">
    <canvas id="canvas"></canvas>
    <div id="gameLayer">
      <div class="g-graph"><canvas id="gameCanvas"></canvas><div class="g-busy" id="gBusy">Будуємо місто…</div></div>
      <div class="g-panel">
        <div class="g-title">Гра: чарівне слово</div>
        <div class="g-task" id="gTask"></div>
        <div class="g-slots" id="gSlots"></div>
        <div class="g-keys">
          <button class="g-key b" data-l="B" title="Синя вулиця">С</button>
          <button class="g-key r" data-l="R" title="Червона вулиця">Ч</button>
          <button class="g-key s" id="gBack" title="Стерти останню літеру (Backspace)">⌫</button>
          <button class="g-key s" id="gClear" title="Очистити слово">✕</button>
        </div>
        <div class="g-row">
          <button class="g-go" id="gGo">Йти!</button>
          <button class="g-alt" id="gAnswer">Показати відповідь</button>
        </div>
        <div class="g-status" id="gStatus"></div>
        <div class="g-settings">
          <span>Слово:<span class="g-seg" id="gSegM"><button data-v="once">один цикл</button><button data-v="cyclic">кілька циклів</button></span></span>
          <span>Довжина слова:<span class="g-seg" id="gSegL"><button data-v="3">3</button><button data-v="4">4</button></span></span>
          <span>Вершин:<span class="g-seg" id="gSegN"><button data-v="8">8</button><button data-v="9">9</button><button data-v="10">10</button><button data-v="11">11</button></span></span>
          <button class="g-alt" id="gNew">Нова гра</button>
        </div>
      </div>
    </div>
    <div class="scene-indicator" id="sceneIndicator"></div>
    <div class="subtitle" id="subtitle" style="opacity:0"></div>
  </div>

  <div class="controls">
    <div class="progress-zone" id="progressZone">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div id="ticksLayer"></div>
    </div>
    <div class="btn-row">
      <button class="ctl" id="btnPlay" title="Грати / Пауза (Space)"><span id="icoPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span id="icoPause" style="display:none"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span></button>
      <button class="ctl" id="btnStop" title="Спочатку (R)"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button class="ctl" id="btnPrev" title="Попередня сцена (←)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ctl" id="btnNext" title="Наступна сцена (→)"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <span class="time" id="timeDisp">0:00 / 0:00</span>
      <div class="seg" id="engineSeg" title="Рушій озвучення">
        <button data-e="hf" title="Українська нейромережа (безкоштовне демо на Hugging Face)">UA нейро</button>
        <button data-e="webspeech">Web Speech</button>
        <button data-e="google" class="on">Google TTS</button>
        <button data-e="none">Тихо</button>
      </div>
      <select id="hfVoice" title="Голос (для UA нейро)"><option value="Тетяна (жіночий) 👩">Тетяна</option><option value="Лада (жіночий) 👩" selected>Лада</option><option value="Дмитро (чоловічий) 👨">Дмитро</option><option value="Микита (чоловічий) 👨">Микита</option><option value="Олекса (чоловічий) 👨">Олекса</option></select>
      <select id="speedSel" title="Швидкість">
        <option value="0.75">0.75×</option><option value="1" selected>1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      </select>
      <label class="chk"><input type="checkbox" id="chkSubs"><span>Субтитри</span></label>
      <label class="chk"><input type="checkbox" id="chkLabels" checked><span>Назви сцен</span></label>
      <label class="chk"><input type="checkbox" id="chkDebug"><span>Транскрипт</span></label>
      <span class="voice" id="voiceState">🔈</span>
    </div>
  </div>

  <div class="debug-section" id="debugSection" style="display:none">
    <h3>📜 Транскрипт: натисніть на сцену, щоб перейти до неї</h3>
    <div class="scene-list" id="sceneList"></div>
  </div>
</div>

<script>
'use strict';
/* ================= БАЗА ================= */
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const subtitleEl=document.getElementById('subtitle'),sceneIndicator=document.getElementById('sceneIndicator');
const progressZone=document.getElementById('progressZone'),progressFill=document.getElementById('progressFill');
const timeDisp=document.getElementById('timeDisp'),voiceState=document.getElementById('voiceState');
const ticksLayer=document.getElementById('ticksLayer'),sceneListEl=document.getElementById('sceneList');
const debugSection=document.getElementById('debugSection');
const chkSubs=document.getElementById('chkSubs'),chkLabels=document.getElementById('chkLabels'),chkDebug=document.getElementById('chkDebug');
const btnPlay=document.getElementById('btnPlay'),btnStop=document.getElementById('btnStop'),
      btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),
      icoPlay=document.getElementById('icoPlay'),icoPause=document.getElementById('icoPause'),
      speedSel=document.getElementById('speedSel'),engineSeg=document.getElementById('engineSeg');

let W=0,H=0,K=1,DPR=1;
function resize(){const r=canvas.getBoundingClientRect();DPR=window.devicePixelRatio||1;
  W=r.width;H=r.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  K=Math.max(.6,Math.min(1.1,W/1150));}
window.addEventListener('resize',resize);resize();

const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eob=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const stag=(t,s,d)=>clamp((t-s)/d,0,1);
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const BLUE='#2563eb',RED='#dc2626';
let gtNow=0;
function fnt(px,bold){ctx.font=(bold?'bold ':'')+Math.round(px*K)+'px Georgia,"Times New Roman",serif'}
function fntE(px){ctx.font=Math.round(px*K)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'}
function txt(t,x,y,al){ctx.textAlign=al||'center';ctx.fillText(t,x,y)}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function card(x,y,w,h){ctx.fillStyle='rgba(255,255,255,.93)';rr(x,y,w,h,10*K);ctx.fill();
  ctx.strokeStyle='#d4cfc7';ctx.lineWidth=1.5*K;ctx.stroke()}
function chip(text,x,y,al,col){col=col||'#1e40af';if(al<=0)return;ctx.globalAlpha=al;fnt(16,true);
  const tw=ctx.measureText(text).width;ctx.fillStyle='rgba(255,255,255,.95)';rr(x-tw/2-10*K,y-14*K,tw+20*K,26*K,7*K);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=col;txt(text,x,y+5*K);ctx.globalAlpha=1}
function stamp(text,x,y,size,color,st,t0,rot){const p=eob(stag(st,t0,0.45));if(p<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate((rot||-0.1)*(1-p*.5));ctx.scale(p,p);
  fnt(size,true);const w2=ctx.measureText(text).width+36*K;
  ctx.fillStyle='rgba(255,255,255,.93)';rr(-w2/2,-size*.72*K,w2,size*1.44*K,10*K);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=3*K;ctx.stroke();ctx.fillStyle=color;txt(text,0,size*.34*K);ctx.restore()}
function shock(x,y,st,t0,color,R){R=R||180;const u=stag(st,t0,0.9);if(u<=0||u>=1)return;
  ctx.strokeStyle=color;ctx.globalAlpha=(1-u)*.8;ctx.lineWidth=(4*(1-u)+1)*K;
  ctx.beginPath();ctx.arc(x,y,u*R*K,0,TAU);ctx.stroke();ctx.globalAlpha=1}
function confetti(x,y,st,t0,n){for(let i=0;i<n;i++){const u=(st-t0)-i*.012;if(u<0||u>2.6)continue;
  const a=rnd(i)*TAU,v=(110+rnd(i+50)*170)*K,dx=Math.cos(a)*v*u*.6,dy=Math.sin(a)*v*u*.6+140*K*u*u;
  ctx.globalAlpha=clamp(1-u/2.6,0,1);ctx.fillStyle=[BLUE,RED,'#eab308','#16a34a'][i%4];
  ctx.beginPath();ctx.arc(x+dx,y+dy,3.5*K,0,TAU);ctx.fill()}ctx.globalAlpha=1}
function typeText(text,st,t0){const n=Math.floor(Math.max(0,(st-t0))*30);if(n<=0)return null;
  return text.slice(0,n)+(n<text.length&&Math.floor(gtNow*3)%2?'▌':'')}
function caption(text,st,t0,y){const shown=typeText(text,st,t0);if(!shown)return;
  fnt(19);const tw=ctx.measureText(text).width;
  ctx.fillStyle='rgba(255,255,255,.88)';rr(W/2-tw/2-14,y-24*K,tw+28,34*K,8);ctx.fill();
  ctx.strokeStyle='#d4cfc7';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#4a3f2e';txt(shown,W/2,y)}
function sceneTitle(t,st,col){col=col||'#2c2416';const p=eob(stag(st,0.1,0.6));if(p>0){
  ctx.save();ctx.translate(W/2,44);ctx.scale(Math.max(.001,p),Math.max(.001,p));
  fnt(30,true);ctx.fillStyle=col;txt(t,0,0);ctx.restore()}
  const u=eo(stag(st,0.4,0.5));if(u>0){ctx.strokeStyle='#e11d48';ctx.lineWidth=3*K;ctx.beginPath();
  ctx.moveTo(W/2-95*K*u,56);ctx.lineTo(W/2+95*K*u,56);ctx.stroke()}}
function arrowHead(x,y,ang,size,col,a){if(a<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=a;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-size,-size*0.7);ctx.lineTo(size*0.6,0);ctx.lineTo(-size,size*0.7);ctx.closePath();ctx.fill();ctx.restore()}
function curveArrow(x1,y1,x2,y2,bend,col,pop,lw){if(pop<=0)return;const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;const nx=-dy/len,ny=dx/len;
  const cx2=mx+nx*bend,cy2=my+ny*bend;
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.globalAlpha=pop;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx2,cy2,x2,y2);ctx.stroke();
  arrowHead(x2,y2,Math.atan2(y2-cy2,x2-cx2),8*K,col,pop);ctx.globalAlpha=1}
function heart(x,y,s,a){ctx.save();ctx.translate(x,y);ctx.scale(s/8,s/8);ctx.globalAlpha=a;
  ctx.fillStyle='#ec4899';ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-6,-2,-3,-8,0,-3);

/* ================= ГРА «ЧАРІВНЕ СЛОВО» (після презентації) =================
   Знайти слово з L літер (С — синя вулиця, Ч — червона), яке з будь-якого перехрестя приводить у задану вершину.
   Місто будується в «віртуальному полотні» VW×VH і двічі розплутується; потім масштабується під екран. */
const Game=(function(){
const NODE_RADIUS=20,VW=600,VH=550;
const LET={B:'С',R:'Ч'};

/* ---------- розплутувач (мінімізація перетинів ребер; відпал із часовими зрізами) ---------- */
const UNT_SEGS=6,UNT_MIN_DIST=80,UNT_LEN_W=0.0002;
function untSegInt(ax,ay,bx,by,cx,cy,dx,dy){
  const d1=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax),d2=(bx-ax)*(dy-ay)-(by-ay)*(dx-ax),
        d3=(dx-cx)*(ay-cy)-(dy-cy)*(ax-cx),d4=(dx-cx)*(by-cy)-(dy-cy)*(bx-cx);
  return ((d1>0)!==(d2>0))&&((d3>0)!==(d4>0))}
function untCreateEvaluator(n,edgeDefs){
  const m=edgeDefs.length,S=UNT_SEGS,HIT=NODE_RADIUS+5;
  const ea=new Int32Array(m),eb=new Int32Array(m),eo=new Float64Array(m);
  edgeDefs.forEach((e,i)=>{ea[i]=e.a;eb[i]=e.b;eo[i]=e.off});
  const px=new Float64Array(n),py=new Float64Array(n),poly=[],bb=new Float64Array(4*m);
  for(let i=0;i<m;i++)poly.push(new Float64Array(2*(S+1)));
  const share=new Uint8Array(m*m),isInc=new Uint8Array(n*m),inc=Array.from({length:n},()=>[]);
  for(let e=0;e<m;e++){
    isInc[ea[e]*m+e]=1;isInc[eb[e]*m+e]=1;inc[ea[e]].push(e);inc[eb[e]].push(e);
    for(let f=0;f<m;f++)if(ea[e]===ea[f]||ea[e]===eb[f]||eb[e]===ea[f]||eb[e]===eb[f])share[e*m+f]=1}
  const hitW=new Float64Array(m*n);
  for(let e=0;e<m;e++)for(let v=0;v<n;v++){
    if(v===ea[e]||v===eb[e])continue;
    let w=0;for(const f of inc[v])if(!share[e*m+f])w++;
    hitW[e*n+v]=Math.max(1,w)}
  function updEdge(e){
    const ax=px[ea[e]],ay=py[ea[e]],bx=px[eb[e]],by=py[eb[e]],P=poly[e];
    const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);
    if(d===0){for(let k=0;k<=S;k++){P[2*k]=ax;P[2*k+1]=ay}}
    else{
      const mx=(ax+bx)/2+(-dy/d)*eo[e],my=(ay+by)/2+(dx/d)*eo[e];
      const adx=bx-mx,ady=by-my,ad=Math.hypot(adx,ady)||1;
      const tx=bx-(adx/ad)*NODE_RADIUS,ty=by-(ady/ad)*NODE_RADIUS;
      for(let k=0;k<=S;k++){const t=k/S,u=1-t;
        P[2*k]=u*u*ax+2*u*t*mx+t*t*tx;P[2*k+1]=u*u*ay+2*u*t*my+t*t*ty}}
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(let k=0;k<=S;k++){const x=P[2*k],y=P[2*k+1];
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    bb[4*e]=x0;bb[4*e+1]=y0;bb[4*e+2]=x1;bb[4*e+3]=y1}
  function pairCross(e,f){
    if(share[e*m+f])return 0;
    if(bb[4*e+2]<bb[4*f]||bb[4*f+2]<bb[4*e]||bb[4*e+3]<bb[4*f+1]||bb[4*f+3]<bb[4*e+1])return 0;
    const P=poly[e],Q=poly[f];
    for(let i=0;i<S;i++)for(let j=0;j<S;j++)
      if(untSegInt(P[2*i],P[2*i+1],P[2*i+2],P[2*i+3],Q[2*j],Q[2*j+1],Q[2*j+2],Q[2*j+3]))return 1;
    return 0}
  function hit(e,v){
    const x=px[v],y=py[v];
    if(x<bb[4*e]-HIT||x>bb[4*e+2]+HIT||y<bb[4*e+1]-HIT||y>bb[4*e+3]+HIT)return 0;
    const P=poly[e];
    for(let i=0;i<S;i++){
      const ax=P[2*i],ay=P[2*i+1],bx=P[2*i+2],by=P[2*i+3],vx=bx-ax,vy=by-ay,L=vx*vx+vy*vy;
      let t=L===0?0:((x-ax)*vx+(y-ay)*vy)/L;t=t<0?0:t>1?1:t;
      const cx=ax+t*vx-x,cy=ay+t*vy-y;
      if(cx*cx+cy*cy<HIT*HIT)return 1}
    return 0}
  const hitCost=(e,v)=>hit(e,v)*hitW[e*n+v];
  const nodePen=(u,v)=>{const d=Math.hypot(px[u]-px[v],py[u]-py[v]);return d<UNT_MIN_DIST?2*(UNT_MIN_DIST-d)/UNT_MIN_DIST:0};
  const lenTerm=e=>UNT_LEN_W*Math.hypot(px[ea[e]]-px[eb[e]],py[ea[e]]-py[eb[e]]);
  function setPos(nodes){for(let i=0;i<n;i++){px[i]=nodes[i].x;py[i]=nodes[i].y}for(let e=0;e<m;e++)updEdge(e)}
  function getPos(){return Array.from({length:n},(_,i)=>({x:px[i],y:py[i]}))}
  function move(k,x,y){px[k]=x;py[k]=y;for(const e of inc[k])updEdge(e)}
  function stats(){let cross=0,hits=0;
    for(let e=0;e<m;e++){
      for(let f=e+1;f<m;f++)cross+=pairCross(e,f);
      for(let v=0;v<n;v++)if(v!==ea[e]&&v!==eb[e])hits+=hit(e,v)}

  function total(){let c=0;
    for(let e=0;e<m;e++){
      for(let f=e+1;f<m;f++)c+=pairCross(e,f);
      for(let v=0;v<n;v++)if(v!==ea[e]&&v!==eb[e])c+=hitCost(e,v)}
    for(let e=0;e<m;e++)c+=lenTerm(e);
    for(let u=0;u<n;u++)for(let v=u+1;v<n;v++)c+=nodePen(u,v);
    return c}
  function local(k){let c=0;
    for(const e of inc[k]){
      for(let f=0;f<m;f++){if(f===e||(isInc[k*m+f]&&f<e))continue;c+=pairCross(e,f)}
      for(let v=0;v<n;v++)if(v!==ea[e]&&v!==eb[e])c+=hitCost(e,v);
      c+=lenTerm(e)}
    for(let f=0;f<m;f++)if(!isInc[k*m+f])c+=hitCost(f,k);
    for(let v=0;v<n;v++)if(v!==k)c+=nodePen(k,v);
    return c}
  return {setPos,getPos,move,total,local,stats,px,py}}
function untForceLayout(n,edgeDefs,W,H){
  const M=NODE_RADIUS+12,x=[],y=[];
  for(let i=0;i<n;i++){x.push(M+Math.random()*(W-2*M));y.push(M+Math.random()*(H-2*M))}

function strongly(edges,n){
  let seen=new Set([0]),q=[0];
  while(q.length){const u=q.shift();for(const c of ['B','R']){const v=edges[u][c];if(!seen.has(v)){seen.add(v);q.push(v)}}}
  if(seen.size!==n)return false;
  const rev=Array.from({length:n},()=>[]);
  for(let i=0;i<n;i++){rev[edges[i].B].push(i);rev[edges[i].R].push(i)}
  seen=new Set([0]);q=[0];
  while(q.length){const u=q.shift();for(const v of rev[u])if(!seen.has(v)){seen.add(v);q.push(v)}}
  return seen.size===n}

function wordsOf(len){
  if(!wordsCache[len]){let w=[''];for(let i=0;i<len;i++)w=w.flatMap(x=>[x+'B',x+'R']);wordsCache[len]=w}
  return wordsCache[len]}

    let t=-1,ok=true;
    for(let s=0;s<n&&ok;s++){let c=s;for(const ch of w)c=edges[c][ch];if(t===-1)t=c;else if(t!==c)ok=false}
    if(ok)res.push({word:w,target:t})}
  return res}

const MAX_CYCLES=3;
function applyWord(edges,n,word){const f=new Array(n);for(let s=0;s<n;s++){let c=s;for(const ch of word)c=edges[c][ch];f[s]=c}return f}
// скільки проходів слова потрібно, щоб усі вершини зійшлися в одну: {k,target} або null (k ≤ maxK).
// Образи f, f², … вкладені один в одного: якщо розмір не зменшився — далі вони вже не зійдуться.
function cyclesToSync(f,n,maxK){
  let cur=Array.from({length:n},(_,i)=>i);
  for(let k=1;k<=maxK;k++){
    const next=[...new Set(cur.map(v=>f[v]))];
    if(next.length===1)return {k,target:next[0]};
    if(next.length===cur.length)return null;
    cur=next}

// усі слова довжини len, що діють за 2..MAX_CYCLES циклів (не за один), разом із ціллю та кількістю циклів

    const side=(i<j?1:-1)*base<0?'-':'+',key=Math.min(i,j)+','+Math.max(i,j)+','+side;
    if(!groups.has(key))groups.set(key,[]);groups.get(key).push({i,color,base})}
  for(const list of groups.values()){
    if(list.length<2)continue;
    list.sort((a,b)=>a.i-b.i);

// Ціль — випадкова серед вершин, до яких веде якесь слово довжини L.
function* makeGraphG(n,L,mode){

    if(!strongly(edges,n))continue;

      // жодне слово довжини L не має працювати за один цикл — тож кожному розв'язку потрібне «блукання»
      if(syncPairs(edges,n,L).length)continue;
      const pairs=cyclicPairs(edges,n,L);
      if(!pairs.length)continue;
      const target=pairs[Math.floor(Math.random()*pairs.length)].target;

  if(!hasStarted)overlayStart();
