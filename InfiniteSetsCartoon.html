<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Готель "Нескінченісь". Потужності нескінченних множин</title>
<style>
:root{--bg:#f6f1e7;--txt:#2c2416;--mut:#6b5d4f;--red:#e11d48}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:18px}
.container{width:100%;max-width:1240px;display:flex;flex-direction:column}
.presentation{width:100%;aspect-ratio:16/9;background:#fff;border:2px solid #d4cfc7;
  border-radius:10px 10px 0 0;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
canvas{width:100%;height:100%;display:block;cursor:pointer}
.scene-indicator{position:absolute;top:14px;right:14px;background:rgba(30,64,175,.92);color:#fff;
  padding:5px 12px;border-radius:5px;font-size:13px;font-weight:bold;pointer-events:none}
.subtitle{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.95);padding:10px 20px;border-radius:8px;border:1px solid #d4cfc7;
  font-size:17px;max-width:82%;text-align:center;line-height:1.45;box-shadow:0 2px 10px rgba(0,0,0,.12);
  transition:opacity .3s;pointer-events:none}
.subtitle b{color:#1e40af}
.controls{background:linear-gradient(#241c15,#15100b);border-radius:0 0 10px 10px;padding:6px 14px 12px}
.progress-zone{position:relative;height:40px;cursor:pointer}
.progress-track{position:absolute;left:0;right:0;top:15px;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#e11d48,#f43f5e);border-radius:3px}
.tick{position:absolute;top:11px;width:3px;height:13px;background:rgba(255,255,255,.45);border-radius:2px;transform:translateX(-1px)}
.tick:hover{background:#fff}
.tick.active{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
.tick-label{position:absolute;top:27px;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.62);
  white-space:nowrap;pointer-events:none;font-family:Arial,sans-serif}
.btn-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ctl{background:transparent;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.ctl:hover{background:rgba(255,255,255,.12)}
.ctl svg{width:19px;height:19px;fill:#fff}
.time{color:#fff;font:13px Arial;margin-left:4px;min-width:96px}
.seg{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:none;color:#cfc7ba;padding:5px 10px;font:12px Arial;cursor:pointer}
.seg button+button{border-left:1px solid rgba(255,255,255,.14)}
.seg button.on{background:var(--red);color:#fff}
select{background:#2a221b;color:#eee;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 6px;font:12px Arial}
.chk{display:flex;align-items:center;gap:5px;color:#d9d2c5;font:13px Arial;cursor:pointer;user-select:none}
.chk input{accent-color:var(--red);width:15px;height:15px;cursor:pointer}
.voice{margin-left:auto;color:#fff;font:15px Arial;background:rgba(255,255,255,.1);border-radius:5px;padding:3px 9px}
.voice.active{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.debug-section{margin-top:14px;background:#fff;border:2px solid #d4cfc7;border-radius:8px;padding:14px}
.debug-section h3{font-size:14px;color:var(--mut);margin-bottom:10px}
.scene-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px}
.scene-list button{padding:7px;border:2px solid #d4cfc7;border-radius:6px;background:#fff;color:var(--txt);
  font:12px Georgia;cursor:pointer;text-align:left}
.scene-list button:hover{border-color:#1e40af}
.scene-list button.active{background:#1e40af;color:#fff;border-color:#1e40af}
.subtitle{width:max-content;max-width:90%}
</style>
</head>
<body>
<div class="container">
  <div class="presentation">
    <canvas id="canvas"></canvas>
    <div class="scene-indicator" id="sceneIndicator"></div>
    <div class="subtitle" id="subtitle" style="opacity:0"></div>
  </div>

  <div class="controls">
    <div class="progress-zone" id="progressZone">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div id="ticksLayer"></div>
    </div>
    <div class="btn-row">
      <button class="ctl" id="btnPlay" title="Грати / Пауза (Space)"><span id="icoPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span id="icoPause" style="display:none"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span></button>
      <button class="ctl" id="btnStop" title="Спочатку (R)"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button class="ctl" id="btnPrev" title="Попередня сцена (←)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ctl" id="btnNext" title="Наступна сцена (→)"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <span class="time" id="timeDisp">0:00 / 0:00</span>
      <div class="seg" id="engineSeg" title="Рушій озвучення">
        <button data-e="hf" title="Українська нейромережа (безкоштовне демо на Hugging Face)">UA нейро</button>
        <button data-e="webspeech">Web Speech</button>
        <button data-e="google" class="on">Google TTS</button>
        <button data-e="none">Тихо</button>
      </div>
      <select id="hfVoice" title="Голос (для UA нейро)"><option value="Тетяна (жіночий) 👩">Тетяна</option><option value="Лада (жіночий) 👩">Лада</option><option value="Дмитро (чоловічий) 👨">Дмитро</option><option value="Микита (чоловічий) 👨" selected>Микита</option><option value="Олекса (чоловічий) 👨">Олекса</option></select>
      <select id="speedSel" title="Швидкість">
        <option value="0.75">0.75×</option><option value="1" selected>1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      </select>
      <label class="chk"><input type="checkbox" id="chkSubs" checked><span>Субтитри</span></label>
      <label class="chk"><input type="checkbox" id="chkLabels" checked><span>Назви сцен</span></label>
      <label class="chk"><input type="checkbox" id="chkDebug"><span>Дебаг</span></label>
      <span class="voice" id="voiceState">🔈</span>
    </div>
  </div>

  <div class="debug-section" id="debugSection" style="display:none">
    <h3>🔧 Перейти до сцени</h3>
    <div class="scene-list" id="sceneList"></div>
  </div>
</div>

<script>
'use strict';
/* ================= БАЗА ================= */
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const subtitleEl=document.getElementById('subtitle'),sceneIndicator=document.getElementById('sceneIndicator');
const progressZone=document.getElementById('progressZone'),progressFill=document.getElementById('progressFill');
const timeDisp=document.getElementById('timeDisp'),voiceState=document.getElementById('voiceState');
const ticksLayer=document.getElementById('ticksLayer'),sceneListEl=document.getElementById('sceneList');
const debugSection=document.getElementById('debugSection');
const chkSubs=document.getElementById('chkSubs'),chkLabels=document.getElementById('chkLabels'),chkDebug=document.getElementById('chkDebug');
const btnPlay=document.getElementById('btnPlay'),btnStop=document.getElementById('btnStop'),
      btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),
      icoPlay=document.getElementById('icoPlay'),icoPause=document.getElementById('icoPause'),
      speedSel=document.getElementById('speedSel'),engineSeg=document.getElementById('engineSeg');

let W=0,H=0,K=1,DPR=1;
function resize(){const r=canvas.getBoundingClientRect();DPR=window.devicePixelRatio||1;
  W=r.width;H=r.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  K=Math.max(.6,Math.min(1.1,W/1150));}
window.addEventListener('resize',resize);resize();

const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eob=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const stag=(t,s,d)=>clamp((t-s)/d,0,1);
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const BLUE='#2563eb',RED='#dc2626';
let gtNow=0;
function fnt(px,bold){ctx.font=(bold?'bold ':'')+Math.round(px*K)+'px Georgia,"Times New Roman",serif'}
function fntE(px){ctx.font=Math.round(px*K)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'}
function txt(t,x,y,al){ctx.textAlign=al||'center';ctx.fillText(t,x,y)}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function card(x,y,w,h){ctx.fillStyle='rgba(255,255,255,.93)';rr(x,y,w,h,10*K);ctx.fill();
  ctx.strokeStyle='#d4cfc7';ctx.lineWidth=1.5*K;ctx.stroke()}
function chip(text,x,y,al,col){col=col||'#1e40af';if(al<=0)return;ctx.globalAlpha=al;fnt(16,true);
  const tw=ctx.measureText(text).width;ctx.fillStyle='rgba(255,255,255,.95)';rr(x-tw/2-10*K,y-14*K,tw+20*K,26*K,7*K);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=col;txt(text,x,y+5*K);ctx.globalAlpha=1}
function stamp(text,x,y,size,color,st,t0,rot){const p=eob(stag(st,t0,0.45));if(p<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate((rot||-0.1)*(1-p*.5));ctx.scale(p,p);
  fnt(size,true);const w2=ctx.measureText(text).width+36*K;
  ctx.fillStyle='rgba(255,255,255,.93)';rr(-w2/2,-size*.72*K,w2,size*1.44*K,10*K);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=3*K;ctx.stroke();ctx.fillStyle=color;txt(text,0,size*.34*K);ctx.restore()}
function shock(x,y,st,t0,color,R){R=R||180;const u=stag(st,t0,0.9);if(u<=0||u>=1)return;
  ctx.strokeStyle=color;ctx.globalAlpha=(1-u)*.8;ctx.lineWidth=(4*(1-u)+1)*K;
  ctx.beginPath();ctx.arc(x,y,u*R*K,0,TAU);ctx.stroke();ctx.globalAlpha=1}
function confetti(x,y,st,t0,n){for(let i=0;i<n;i++){const u=(st-t0)-i*.012;if(u<0||u>2.6)continue;
  const a=rnd(i)*TAU,v=(110+rnd(i+50)*170)*K,dx=Math.cos(a)*v*u*.6,dy=Math.sin(a)*v*u*.6+140*K*u*u;
  ctx.globalAlpha=clamp(1-u/2.6,0,1);ctx.fillStyle=[BLUE,RED,'#eab308','#16a34a'][i%4];
  ctx.beginPath();ctx.arc(x+dx,y+dy,3.5*K,0,TAU);ctx.fill()}ctx.globalAlpha=1}
function typeText(text,st,t0){const n=Math.floor(Math.max(0,(st-t0))*30);if(n<=0)return null;
  return text.slice(0,n)+(n<text.length&&Math.floor(gtNow*3)%2?'▌':'')}
function caption(text,st,t0,y){const shown=typeText(text,st,t0);if(!shown)return;
  fnt(19);const tw=ctx.measureText(text).width;
  ctx.fillStyle='rgba(255,255,255,.88)';rr(W/2-tw/2-14,y-24*K,tw+28,34*K,8);ctx.fill();
  ctx.strokeStyle='#d4cfc7';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#4a3f2e';txt(shown,W/2,y)}
function sceneTitle(t,st,col){col=col||'#2c2416';const p=eob(stag(st,0.1,0.6));if(p>0){
  ctx.save();ctx.translate(W/2,44);ctx.scale(Math.max(.001,p),Math.max(.001,p));
  fnt(30,true);ctx.fillStyle=col;txt(t,0,0);ctx.restore()}
  const u=eo(stag(st,0.4,0.5));if(u>0){ctx.strokeStyle='#e11d48';ctx.lineWidth=3*K;ctx.beginPath();
  ctx.moveTo(W/2-95*K*u,56);ctx.lineTo(W/2+95*K*u,56);ctx.stroke()}}
function arrowHead(x,y,ang,size,col,a){if(a<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=a;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-size,-size*0.7);ctx.lineTo(size*0.6,0);ctx.lineTo(-size,size*0.7);ctx.closePath();ctx.fill();ctx.restore()}
function curveArrow(x1,y1,x2,y2,bend,col,pop,lw){if(pop<=0)return;const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;const nx=-dy/len,ny=dx/len;
  const cx2=mx+nx*bend,cy2=my+ny*bend;
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.globalAlpha=pop;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx2,cy2,x2,y2);ctx.stroke();
  arrowHead(x2,y2,Math.atan2(y2-cy2,x2-cx2),8*K,col,pop);ctx.globalAlpha=1}
function heart(x,y,s,a){ctx.save();ctx.translate(x,y);ctx.scale(s/8,s/8);ctx.globalAlpha=a;
  ctx.fillStyle='#ec4899';ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-6,-2,-3,-8,0,-3);
  ctx.bezierCurveTo(3,-8,6,-2,0,4);ctx.fill();ctx.restore()}
function hearts(x,y,st,t0,n){for(let i=0;i<n;i++){const u=st-t0-i*0.5;if(u<0||u>2.4)continue;
  heart(x+Math.sin(u*5+i*2)*12*K,y-14*K-u*50*K,(1.6+(i%2)*0.8)*K*2.2,clamp(1-u/2.4,0,1)*0.9)}}
function popWrap(x,y,p,fn){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(p,p);ctx.translate(-x,-y);fn();ctx.restore()}
function pointer(x1,y1,x2,y2,st,t0){const u=stag(st,t0,0.4);if(u<=0)return;
  ctx.globalAlpha=u;ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.6;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.arc(x2,y2,3.5*K,0,TAU);ctx.fill();ctx.globalAlpha=1}
function wordChips(cx,cy,word,st,t0,active,doneN,sc){sc=sc||1;const n=word.length,gap=54*K*sc;const x0=cx-(n-1)*gap/2;
  word.forEach((L,i)=>{const p=eob(stag(st,t0+i*0.3,0.4));if(p<=0)return;
    const x=x0+i*gap,col=(L==='B')?BLUE:RED,act=(i===active);
    const sc2=act?(1+0.1*Math.sin(gtNow*6)):1;
    ctx.save();ctx.translate(x,cy);ctx.scale(sc*sc2*p,sc*sc2*p);
    ctx.beginPath();ctx.arc(0,0,16*K,0,TAU);ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle=act?'#fff':'rgba(15,23,42,.35)';ctx.lineWidth=act?3:1.5;ctx.stroke();
    if(act){ctx.globalAlpha=0.5+0.3*Math.sin(gtNow*7);ctx.beginPath();ctx.arc(0,0,23*K,0,TAU);
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1}
    fnt(15,true);ctx.fillStyle='#fff';txt(L==='B'?'С':'Ч',0,5.5*K);
    if(i<doneN){fnt(13,true);ctx.fillStyle='#22c55e';txt('✓',13*K,-13*K)}
    ctx.restore()})}
function waves(x,y,st,t0,col){if(st<t0)return;const u0=st-t0;
  for(let k=0;k<3;k++){const u=(u0*1.1-k*0.33)%1;if(u<0)continue;
    ctx.globalAlpha=(1-u)*0.8;ctx.strokeStyle=col;ctx.lineWidth=2*K;
    ctx.beginPath();ctx.arc(x,y,(6+u*20)*K,-0.9,0.9);ctx.stroke()}ctx.globalAlpha=1}
function drawWalkerDot(x,y,col){ctx.beginPath();ctx.arc(x,y-10*K,9*K,0,TAU);ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#1f2937';ctx.beginPath();ctx.arc(x-3*K,y-12*K,1.4*K,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(x+3*K,y-12*K,1.4*K,0,TAU);ctx.fill()}

/* ================= ПОТУЖНОСТІ НЕСКІНЧЕННИХ МНОЖИН ================= */
const GRN='#16a34a',AMB='#d97706',INK='#2c2416',GOLD='#eab308',PINKC='#ec4899',VIO='#7c3aed',CYAN='#0891b2';
const gcol=(g,l)=>'hsl('+Math.round((g*47)%360)+',62%,'+(l||60)+'%)';
const Rn=(i,j)=>(i+j-1)*(i+j-2)/2+j;
const invR=n=>{const d=Math.ceil((Math.sqrt(8*n+1)-1)/2),j=n-d*(d-1)/2;return[d+1-j,j]};
function wrap(s,x,y,n,lh,al){let ln='';s.split(' ').forEach(q=>{if((ln+' '+q).length>n){txt(ln,x,y,al);ln=q;y+=lh*K}else ln=ln?ln+' '+q:q});txt(ln,x,y,al);return y}
function note(x,y,w,h,col,s,n,a){if(a<=0)return;popWrap(x+w/2,y+h/2,a,()=>{card(x,y,w,h);fnt(15,true);ctx.fillStyle=col;wrap(s,x+w/2,y+h*.4,n,21)})}
function dot(x,y,c,r){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,(r||7)*K,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
function spaceBg(gt){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#e6ecff');g.addColorStop(1,'#f5f0ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){const x=rnd(i)*W,y=rnd(i+300)*H*.85,tw=.5+.5*Math.sin(gt*1.5+i);ctx.fillStyle='rgba(59,70,140,'+(.2+.3*tw)+')';ctx.beginPath();ctx.arc(x,y,(.8+rnd(i+600)*1.5)*K,0,TAU);ctx.fill()}}
function porter(x,y,s,gt,arm){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#1e3a8a';rr(-36,22,72,80,14);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-10,22);ctx.lineTo(0,44);ctx.lineTo(10,22);ctx.closePath();ctx.fill();
  ctx.fillStyle=RED;[[-1],[1]].forEach(a=>{ctx.beginPath();ctx.moveTo(0,36);ctx.lineTo(a[0]*11,30);ctx.lineTo(a[0]*11,42);ctx.closePath();ctx.fill()});
  ctx.fillStyle=GOLD;[56,72,88].forEach(yy=>{ctx.beginPath();ctx.arc(0,yy,3.5,0,TAU);ctx.fill()});
  const hx=58+Math.sin(gt*3)*3*arm,hy=24-arm*12;ctx.strokeStyle='#1e3a8a';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(32,42);ctx.lineTo(hx,hy);ctx.stroke();ctx.fillStyle='#fcd9b6';ctx.beginPath();ctx.arc(hx,hy,8,0,TAU);ctx.fill();
  ctx.fillStyle='#fcd9b6';ctx.beginPath();ctx.arc(0,0,26,0,TAU);ctx.fill();ctx.strokeStyle='#a8825a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#b91c1c';rr(-24,-36,48,20,6);ctx.fill();ctx.fillStyle=GOLD;ctx.fillRect(-24,-20,48,4);ctx.fillStyle='#7f1d1d';ctx.fillRect(-29,-16,58,5);
  const bl=Math.sin(gt*1.3)>.97?1:6;ctx.fillStyle=INK;ctx.fillRect(-12,-4,5,bl);ctx.fillRect(7,-4,5,bl);
  ctx.strokeStyle='#4a3f2e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-15,11);ctx.quadraticCurveTo(0,4,0,10);ctx.quadraticCurveTo(0,4,15,11);ctx.stroke();ctx.restore()}
function ship(x,y,s,gt,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='rgba(251,146,60,'+(.6+.3*Math.sin(gt*20))+')';ctx.beginPath();ctx.moveTo(-14,16);ctx.lineTo(0,34+Math.sin(gt*25)*5);ctx.lineTo(14,16);ctx.closePath();ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,70,20,0,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(186,230,253,.92)';ctx.beginPath();ctx.ellipse(0,-10,26,20,0,Math.PI,TAU);ctx.fill();ctx.strokeStyle='#0369a1';ctx.stroke();
  for(let k=-2;k<=2;k++){ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(k*22,4,4,0,TAU);ctx.fill()}ctx.restore()}

  return m.length?m:[text]}
function hfFallback(text,idx){hfWait=false;engine='google';updateEngineUI();
  if(!hfMsg)hfMsg='⚠ UA нейро недоступне → Google';speak(text,idx)}
hfVoiceSel.onchange=()=>{if(engine==='hf'&&isPlaying&&!isPaused){stopSpeaking();speakScene()}};

function stopSpeaking(){hfWait=false;gToken++;if(gAudio){gAudio.pause();gAudio=null}
  if(synth){try{synth.cancel()}catch(e){}}
  ttsActive=false;ttsDone=true}

/* ================= ПЛЕЄР ================= */
let currentScene=0,sceneTime=0,globalTime=0,isPlaying=false,isPaused=false,
    hasStarted=false,finished=false,holdTimer=0,speed=1;
function setPlayIcon(playing){icoPlay.style.display=playing?'none':'';
  icoPause.style.display=playing?'':'none'}
function setSubtitle(sc){if(chkSubs.checked){subtitleEl.textContent=sc.text;
  subtitleEl.style.opacity='1'}else subtitleEl.style.opacity='0'}
function startScene(i){currentScene=clamp(i,0,scenes.length-1);sceneTime=0;holdTimer=0;
  const sc=scenes[currentScene];setSubtitle(sc);stopSpeaking();
  if(isPlaying)speak(sc.text,currentScene);updateSceneButtons()}
function speakScene(){const sc=scenes[currentScene];setSubtitle(sc);speak(sc.text,currentScene)}
function startShow(){hasStarted=true;finished=false;isPlaying=true;isPaused=false;
  setPlayIcon(true);startScene(0)}
function doPause(){isPaused=true;setPlayIcon(false);
  if(engine==='webspeech'&&synth)synth.pause();
  if((engine==='google'||engine==='hf')&&gAudio)gAudio.pause()}
function doResume(){isPaused=false;setPlayIcon(true);
  if(engine==='webspeech'&&synth)synth.resume();
  if((engine==='google'||engine==='hf')&&gAudio)gAudio.play()}
function togglePlay(){if(!hasStarted){startShow();return}
  if(!isPlaying){finished=false;isPlaying=true;isPaused=false;setPlayIcon(true);speakScene();return}
  isPaused?doResume():doPause()}
function stopShow(){isPlaying=false;isPaused=false;finished=false;setPlayIcon(false);
  stopSpeaking();currentScene=0;sceneTime=0;holdTimer=0;
  subtitleEl.style.opacity='0';updateSceneButtons()}
function seekScene(i){i=clamp(i,0,scenes.length-1);stopSpeaking();finished=false;
  currentScene=i;sceneTime=0;holdTimer=0;updateSceneButtons();
  if(isPlaying&&!isPaused)speakScene();else setSubtitle(scenes[i])}
function seekTime(T){let i=0;while(i<scenes.length-1&&T>=cum[i+1])i++;
  stopSpeaking();finished=false;currentScene=i;sceneTime=T-cum[i];holdTimer=0;
  updateSceneButtons();if(isPlaying&&!isPaused)speakScene();else setSubtitle(scenes[i])}

/* ================= ОБРОБНИКИ ================= */
btnPlay.onclick=togglePlay;
btnStop.onclick=stopShow;
btnNext.onclick=()=>seekScene(currentScene+1);
btnPrev.onclick=()=>seekScene(currentScene-1);
progressZone.onclick=e=>{const r=progressZone.getBoundingClientRect();
  seekTime(clamp((e.clientX-r.left)/r.width,0,1)*TOTAL)};
engineSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{userPicked=true;
  engine=b.dataset.e;updateEngineUI();stopSpeaking();if(engine==='hf')hfEnsure();
  if(isPlaying&&!isPaused)speakScene()});
speedSel.onchange=()=>{speed=parseFloat(speedSel.value)};
chkSubs.onchange=()=>{if(!chkSubs.checked)subtitleEl.style.opacity='0';
  else setSubtitle(scenes[currentScene])};
chkDebug.onchange=()=>{debugSection.style.display=chkDebug.checked?'block':'none'};
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.code==='ArrowRight')seekScene(currentScene+1);
  else if(e.code==='ArrowLeft')seekScene(currentScene-1);
  else if(e.code==='KeyR')stopShow()});
canvas.addEventListener('click',()=>{if(!hasStarted)startShow()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lastTs=performance.now()});

/* ================= ЗАСІЧКИ / ДЕБАГ ================= */
const tickEls=[];
scenes.forEach((sc,i)=>{const t=document.createElement('div');t.className='tick';
  t.style.left=(cum[i]/TOTAL*100)+'%';t.title=(i+1)+'. '+sc.tick+' ('+sc.dur+' с)';
  t.onclick=e=>{e.stopPropagation();seekScene(i)};ticksLayer.appendChild(t);tickEls.push(t);
  const l=document.createElement('div');l.className='tick-label';l.style.left=(cum[i]/TOTAL*100)+'%';
  l.textContent=sc.tick;ticksLayer.appendChild(l)});
function updateLabelsVis(){ticksLayer.querySelectorAll('.tick-label').forEach(l=>
  l.style.display=chkLabels.checked?'':'none')}
chkLabels.onchange=updateLabelsVis;updateLabelsVis();
scenes.forEach((sc,i)=>{const b=document.createElement('button');
  b.textContent=fmt(cum[i])+' · '+sc.tick;b.onclick=()=>seekScene(i);
  sceneListEl.appendChild(b)});
function updateSceneButtons(){sceneListEl.querySelectorAll('button').forEach((b,i)=>
  b.classList.toggle('active',i===currentScene));
  sceneIndicator.textContent=(currentScene+1)+'/'+scenes.length+' · '+scenes[currentScene].tick}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function updateHud(){const sc=scenes[currentScene];
  const cur=cum[currentScene]+Math.min(sceneTime,sc.dur);
  progressFill.style.width=(cur/TOTAL*100)+'%';
  timeDisp.textContent=fmt(cur)+' / '+fmt(TOTAL);
  tickEls.forEach((t,i)=>t.classList.toggle('active',i===currentScene));
  voiceState.textContent=(engine==='none'?'🔇':(ttsActive?'🔊':'🔈'))+(hfMsg?' '+hfMsg:'');
  voiceState.classList.toggle('active',ttsActive)}
updateSceneButtons();

/* ================= ГОЛОВНИЙ ЦИКЛ ================= */
let lastTs=performance.now();
function overlayStart(){ctx.fillStyle='rgba(8,12,26,.55)';ctx.fillRect(0,0,W,H);
  const pu=1+0.05*Math.sin(performance.now()/300);
  ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(pu,pu);
  ctx.beginPath();ctx.arc(0,0,54,0,TAU);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();
  ctx.strokeStyle='#e11d48';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-14,-22);ctx.lineTo(-14,22);ctx.lineTo(24,0);ctx.closePath();
  ctx.fillStyle='#e11d48';ctx.fill();ctx.restore();
  fnt(22,true);ctx.fillStyle='#fff';txt('Натисніть, щоб дивитись з озвученням',W/2,H/2+70);
  fnt(15);ctx.fillStyle='rgba(255,255,255,.85)';
  txt('Space — пауза · ←/→ — сцени · клік по шкалі — перемотка',W/2,H/2+102)}

function frame(ts){const rawDt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(isPlaying&&!isPaused&&!(engine==='hf'&&hfWait)){const dt=rawDt*speed;globalTime+=dt;sceneTime+=dt;
    const sc=scenes[currentScene];
    const animDone=sceneTime>=sc.dur;
    const voiceOK=engine==='none'||ttsDone||sceneTime>sc.dur+(engine==='webspeech'?30:60);
    if(animDone&&voiceOK){holdTimer+=dt;
      if(holdTimer>=0.7){
        if(currentScene<scenes.length-1)startScene(currentScene+1);
        else{finished=true;isPlaying=false;isPaused=false;setPlayIcon(false);stopSpeaking()}}}
    else holdTimer=0}
  gtNow=globalTime; /* критично: мерехтіння ліхтарів, курсор, шеврони, сніг */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fbf7f0');g.addColorStop(1,'#f2ebdd');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  scenes[currentScene].draw(W,H,sceneTime,globalTime);
  const f=1-stag(sceneTime,0,0.45);
  if(f>0&&hasStarted){ctx.fillStyle='rgba(251,247,240,'+f*0.6+')';ctx.fillRect(0,0,W,H)}
  if(hasStarted&&engine==='hf'&&hfWait){ctx.fillStyle='rgba(30,30,30,.75)';ctx.font='bold 16px Arial';ctx.textAlign='left';ctx.fillText('Готую озвучення…',16,H-16)}
  if(!hasStarted)overlayStart();
  updateHud();
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
