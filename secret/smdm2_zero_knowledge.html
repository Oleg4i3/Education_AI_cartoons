<title>СМДМ-2. Серія 2. Печера Алі-баби: доведення з нульовим розголошенням</title>
<style>
:root{--bg:#f6f1e7;--txt:#2c2416;--mut:#6b5d4f;--red:#e11d48}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:18px}
.container{width:100%;max-width:1240px;display:flex;flex-direction:column}
.presentation{width:100%;aspect-ratio:16/9;background:#fff;border:2px solid #d4cfc7;
  border-radius:10px 10px 0 0;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
canvas{width:100%;height:100%;display:block;cursor:pointer}
.scene-indicator{position:absolute;top:14px;right:14px;background:rgba(30,64,175,.92);color:#fff;
  padding:5px 12px;border-radius:5px;font-size:13px;font-weight:bold;pointer-events:none}
.subtitle{position:absolute;left:0;right:0;bottom:10px;width:100%;box-sizing:border-box;
  padding:0 4%;background:transparent;color:#fff;font-weight:bold;
  font-size:clamp(15px,2.1vw,26px);text-align:center;line-height:1.4;
  text-shadow:0 0 3px #000,0 0 6px #000,0 2px 5px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.7);
  transition:opacity .3s;pointer-events:none}
.controls{background:linear-gradient(#241c15,#15100b);border-radius:0 0 10px 10px;padding:6px 14px 12px}
.progress-zone{position:relative;height:40px;cursor:pointer}
.progress-track{position:absolute;left:0;right:0;top:15px;height:5px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#e11d48,#f43f5e);border-radius:3px}
.tick{position:absolute;top:11px;width:3px;height:13px;background:rgba(255,255,255,.45);border-radius:2px;transform:translateX(-1px)}
.tick:hover{background:#fff}
.tick.active{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
.tick-label{position:absolute;top:27px;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.62);
  white-space:nowrap;pointer-events:none;font-family:Arial,sans-serif}
.btn-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ctl{background:transparent;border:none;cursor:pointer;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.ctl:hover{background:rgba(255,255,255,.12)}
.ctl svg{width:19px;height:19px;fill:#fff}
.time{color:#fff;font:13px Arial;margin-left:4px;min-width:96px}
.seg{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:none;color:#cfc7ba;padding:5px 10px;font:12px Arial;cursor:pointer}
.seg button+button{border-left:1px solid rgba(255,255,255,.14)}
.seg button.on{background:var(--red);color:#fff}
select{background:#2a221b;color:#eee;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 6px;font:12px Arial}
.chk{display:flex;align-items:center;gap:5px;color:#d9d2c5;font:13px Arial;cursor:pointer;user-select:none}
.chk input{accent-color:var(--red);width:15px;height:15px;cursor:pointer}
.voice{margin-left:auto;color:#fff;font:15px Arial;background:rgba(255,255,255,.1);border-radius:5px;padding:3px 9px}
.voice.active{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.debug-section{margin-top:14px;background:#fff;border:2px solid #d4cfc7;border-radius:8px;padding:14px}
.debug-section h3{font-size:14px;color:var(--mut);margin-bottom:10px}
.scene-list{display:flex;flex-direction:column;gap:8px}
.scene-list button{width:100%;padding:10px 12px;line-height:1.5;font:14px Georgia,serif;border:2px solid #d4cfc7;border-radius:6px;background:#fff;color:var(--txt);cursor:pointer;text-align:left}
.scene-list button:hover{border-color:#1e40af}
.scene-list button.active{background:#1e40af;color:#fff;border-color:#1e40af}
.scene-list button b{display:block;font-size:13px;color:#1e40af;margin-bottom:3px}
.scene-list button span{display:block;font-weight:normal;color:#4a3f2e}
.scene-list button.active b,.scene-list button.active span{color:#fff}
</style>
</head>
<body>
<div class="container">
  <div class="presentation">
    <canvas id="canvas"></canvas>
    <div class="scene-indicator" id="sceneIndicator"></div>
    <div class="subtitle" id="subtitle" style="opacity:0"></div>
  </div>

  <div class="controls">
    <div class="progress-zone" id="progressZone">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="btn-row">
      <button class="ctl" id="btnPlay" title="Грати / Пауза (Space)"><span id="icoPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span id="icoPause" style="display:none"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></span></button>

      <button class="ctl" id="btnNext" title="Наступна сцена (→)"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <span class="time" id="timeDisp">0:00 / 0:00</span>
      <div class="seg" id="engineSeg" title="Рушій озвучення">
        <button data-e="hf" title="Українська нейромережа (безкоштовне демо на Hugging Face)">UA нейро</button>

      </div>
      <select id="hfVoice" title="Голос (для UA нейро)"><option value="Тетяна (жіночий) 👩">Тетяна</option><option value="Лада (жіночий) 👩" selected>Лада</option><option value="Дмитро (чоловічий) 👨">Дмитро</option><option value="Микита (чоловічий) 👨">Микита</option><option value="Олекса (чоловічий) 👨">Олекса</option></select>
      <select id="speedSel" title="Швидкість">
        <option value="0.75">0.75×</option><option value="1" selected>1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      </select>
      <label class="chk"><input type="checkbox" id="chkSubs"><span>Субтитри</span></label>
      <label class="chk"><input type="checkbox" id="chkLabels" checked><span>Назви сцен</span></label>
      <label class="chk"><input type="checkbox" id="chkDebug"><span>Транскрипт</span></label>
      <span class="voice" id="voiceState">🔈</span>
    </div>
  </div>

  <div class="debug-section" id="debugSection" style="display:none">
    <h3>📜 Транскрипт: натисніть на сцену, щоб перейти до неї</h3>
    <div class="scene-list" id="sceneList"></div>
  </div>
</div>

<script>
'use strict';
/* ================= БАЗА ================= */
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const subtitleEl=document.getElementById('subtitle'),sceneIndicator=document.getElementById('sceneIndicator');
const progressZone=document.getElementById('progressZone'),progressFill=document.getElementById('progressFill');
const timeDisp=document.getElementById('timeDisp'),voiceState=document.getElementById('voiceState');
const ticksLayer=document.getElementById('ticksLayer'),sceneListEl=document.getElementById('sceneList');
const debugSection=document.getElementById('debugSection');
const chkSubs=document.getElementById('chkSubs'),chkLabels=document.getElementById('chkLabels'),chkDebug=document.getElementById('chkDebug');
const btnPlay=document.getElementById('btnPlay'),btnStop=document.getElementById('btnStop'),
      btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext'),
      icoPlay=document.getElementById('icoPlay'),icoPause=document.getElementById('icoPause'),
      speedSel=document.getElementById('speedSel'),engineSeg=document.getElementById('engineSeg');

let W=0,H=0,K=1,DPR=1;
function resize(){const r=canvas.getBoundingClientRect();DPR=window.devicePixelRatio||1;
  W=r.width;H=r.height;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  K=Math.max(.6,Math.min(1.1,W/1150));}
window.addEventListener('resize',resize);resize();

const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eob=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const stag=(t,s,d)=>clamp((t-s)/d,0,1);
const sm=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const BLUE='#2563eb',RED='#dc2626';
let gtNow=0;
function fnt(px,bold){ctx.font=(bold?'bold ':'')+Math.round(px*K)+'px Georgia,"Times New Roman",serif'}
function txt(t,x,y,al){ctx.textAlign=al||'center';ctx.fillText(t,x,y)}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function card(x,y,w,h){ctx.fillStyle='rgba(255,255,255,.93)';rr(x,y,w,h,10*K);ctx.fill();
  ctx.strokeStyle='#d4cfc7';ctx.lineWidth=1.5*K;ctx.stroke()}
function chip(text,x,y,al,col){col=col||'#1e40af';if(al<=0)return;ctx.globalAlpha=al;fnt(16,true);
  const tw=ctx.measureText(text).width;ctx.fillStyle='rgba(255,255,255,.95)';rr(x-tw/2-10*K,y-14*K,tw+20*K,26*K,7*K);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=col;txt(text,x,y+5*K);ctx.globalAlpha=1}
function stamp(text,x,y,size,color,st,t0,rot){const p=eob(stag(st,t0,0.45));if(p<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate((rot||-0.1)*(1-p*.5));ctx.scale(p,p);
  fnt(size,true);const w2=ctx.measureText(text).width+36*K;
  ctx.fillStyle='rgba(255,255,255,.93)';rr(-w2/2,-size*.72*K,w2,size*1.44*K,10*K);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=3*K;ctx.stroke();ctx.fillStyle=color;txt(text,0,size*.34*K);ctx.restore()}
function shock(x,y,st,t0,color,R){R=R||180;const u=stag(st,t0,0.9);if(u<=0||u>=1)return;
  ctx.strokeStyle=color;ctx.globalAlpha=(1-u)*.8;ctx.lineWidth=(4*(1-u)+1)*K;
  ctx.beginPath();ctx.arc(x,y,u*R*K,0,TAU);ctx.stroke();ctx.globalAlpha=1}
function confetti(x,y,st,t0,n){for(let i=0;i<n;i++){const u=(st-t0)-i*.012;if(u<0||u>2.6)continue;
  const a=rnd(i)*TAU,v=(110+rnd(i+50)*170)*K,dx=Math.cos(a)*v*u*.6,dy=Math.sin(a)*v*u*.6+140*K*u*u;
  ctx.globalAlpha=clamp(1-u/2.6,0,1);ctx.fillStyle=[BLUE,RED,'#eab308','#16a34a'][i%4];
  ctx.beginPath();ctx.arc(x+dx,y+dy,3.5*K,0,TAU);ctx.fill()}ctx.globalAlpha=1}
function sceneTitle(t,st,col){col=col||'#2c2416';const p=eob(stag(st,0.1,0.6));if(p>0){
  ctx.save();ctx.translate(W/2,44);ctx.scale(Math.max(.001,p),Math.max(.001,p));
  fnt(30,true);ctx.fillStyle=col;txt(t,0,0);ctx.restore()}
  const u=eo(stag(st,0.4,0.5));if(u>0){ctx.strokeStyle='#e11d48';ctx.lineWidth=3*K;ctx.beginPath();
  ctx.moveTo(W/2-95*K*u,56);ctx.lineTo(W/2+95*K*u,56);ctx.stroke()}}
function popWrap(x,y,p,fn){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(p,p);ctx.translate(-x,-y);fn();ctx.restore()}

/* ================= ТЕМА: ПІДПИС НАОСЛІП ================= */
const OG='#15803d',OB='#2563eb',OR='#dc2626',OY='#64748b',OK='#2c2416',SKIN='#f3cfa6',PUR='#7c3aed';
function oLab(t,x,y,col,px,al,aln){ctx.globalAlpha=al==null?1:al;fnt(px||18,true);ctx.fillStyle=col||OK;txt(t,x,y,aln);ctx.globalAlpha=1}
function oRR(x,y,w,h,col,lw){rr(x,y,w,h,12*K);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=(lw||2.5)*K;ctx.stroke()}
function oBub(t,x,y,st,t0,t1,col){if(st<t0||st>t1)return;ctx.save();ctx.globalAlpha=Math.min(1,(st-t0)*5,(t1-st)*5);fnt(17,true);const tw=ctx.measureText(t).width+26*K,h=34*K,bx=clamp(x-tw/2,8,W-tw-8);
  rr(bx,y-h,tw,h,12*K);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=col||OK;ctx.lineWidth=2*K;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-8*K,y);ctx.lineTo(x,y+14*K);ctx.lineTo(x+8*K,y);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.fillStyle=col||OK;txt(t,bx+tw/2,y-h/2+6*K);ctx.restore()}
function oFig(x,y,s,o){o=o||{};const d=o.dir||1,t=gtNow;ctx.save();ctx.translate(x,y+(o.bob||0)*K);ctx.scale(d*s*K,s*K);ctx.lineCap='round';
  const coat=o.coat||'#374151',hair=o.hair||'#3b2a1a';
  if(o.long){ctx.fillStyle=hair;ctx.beginPath();ctx.moveTo(36,-188);ctx.arc(0,-188,36,0,Math.PI,true);ctx.lineTo(-39,-126);ctx.lineTo(39,-126);ctx.closePath();ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OK;ctx.stroke()}
  ctx.strokeStyle=o.legs?o.legs:o.dress?SKIN:o.suit?'#334155':o.gen?'#3f4f2c':'#1f2937';ctx.lineWidth=o.legs?13:o.dress?9:(o.suit||o.gen)?18:13;ctx.beginPath();ctx.moveTo(-14,-56);ctx.lineTo(-14,-6);ctx.moveTo(14,-56);ctx.lineTo(14,-6);ctx.stroke();
  ctx.fillStyle='#111';[-14,14].forEach(q=>{ctx.beginPath();ctx.ellipse(q+5,-3,13,6,0,0,TAU);ctx.fill()});
  const sx=o.suit||o.gen,bw=o.dress?52:sx?38:44,tw=sx?34:30;ctx.beginPath();ctx.moveTo(-tw,-152);ctx.lineTo(tw,-152);ctx.lineTo(bw,-52);ctx.lineTo(-bw,-52);ctx.closePath();ctx.fillStyle=coat;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OK;ctx.stroke();
  if(o.suit){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-13,-152);ctx.lineTo(13,-152);ctx.lineTo(0,-116);ctx.fill();ctx.strokeStyle='#0f172a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-13,-152);ctx.lineTo(0,-116);ctx.lineTo(13,-152);ctx.stroke()}
  if(o.tie){ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(0,-150);ctx.lineTo(7,-132);ctx.lineTo(0,-100);ctx.lineTo(-7,-132);ctx.fill()}
  else if(!o.dress&&!o.suit){ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-43,-95);ctx.lineTo(43,-95);ctx.stroke();ctx.fillStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(-15,-152);ctx.lineTo(0,-124);ctx.lineTo(15,-152);ctx.fill()}
  if(o.bag){ctx.strokeStyle='#78350f';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-26,-148);ctx.lineTo(38,-72);ctx.stroke();ctx.fillStyle='#a16207';rr(18,-92,44,34,6);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OK;ctx.stroke();ctx.fillStyle='#fde68a';ctx.fillRect(34,-80,12,10)}
  const aL=o.armL||[-40,-92],aR=o.armR||[40,-92];
  [[-28,-146,aL],[28,-146,aR]].forEach(q=>{ctx.strokeStyle=coat;ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2][0],q[2][1]);ctx.stroke();ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(q[2][0],q[2][1],8,0,TAU);ctx.fill()});
  ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(0,-188,30,0,TAU);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OK;ctx.stroke();
  if(!o.hat&&!o.cap||o.long){ctx.fillStyle=hair;ctx.beginPath();ctx.arc(0,-190,31,Math.PI*1.02,Math.PI*1.98);ctx.lineTo(24,-205);ctx.lineTo(-24,-205);ctx.fill()}
  if(o.glasses){ctx.fillStyle='#0b0b0b';rr(-25,-198,23,14,4);ctx.fill();rr(2,-198,23,14,4);ctx.fill();ctx.strokeStyle='#0b0b0b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-3,-192);ctx.lineTo(3,-192);ctx.stroke();ctx.strokeStyle='#9ca3af';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-21,-195);ctx.lineTo(-15,-195);ctx.moveTo(6,-195);ctx.lineTo(12,-195);ctx.stroke()}
  else{const pn=o.face==='panic';ctx.fillStyle='#fff';[-11,11].forEach(q=>{ctx.beginPath();ctx.arc(q,-192,7,0,TAU);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=OK;ctx.stroke()});ctx.fillStyle='#111';[-11,11].forEach(q=>{ctx.beginPath();ctx.arc(q+1,-191,pn?1.8:3.2,0,TAU);ctx.fill()});
    if(pn){ctx.strokeStyle=OK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-19,-203);ctx.lineTo(-5,-209);ctx.moveTo(5,-209);ctx.lineTo(19,-203);ctx.stroke()}}
  ctx.strokeStyle=OK;ctx.lineWidth=3;ctx.fillStyle='#7f1d1d';ctx.beginPath();
  if(o.face==='panic'){ctx.ellipse(0,-170,8,10,0,0,TAU);ctx.fill()}else if(o.face==='smug'){ctx.arc(0,-178,12,.15*Math.PI,.85*Math.PI);ctx.stroke()}else if(o.face==='sad'){ctx.arc(0,-162,10,1.15*Math.PI,1.85*Math.PI);ctx.stroke()}else{ctx.moveTo(-8,-171);ctx.lineTo(8,-171);ctx.stroke()}
  if(o.hat){ctx.fillStyle='#1f2937';ctx.beginPath();ctx.ellipse(0,-214,47,9,0,0,TAU);ctx.fill();rr(-26,-252,52,40,10);ctx.fill();ctx.fillStyle='#7f1d1d';ctx.fillRect(-26,-226,52,9)}
  if(o.cap){ctx.fillStyle='#1d4ed8';ctx.beginPath();ctx.arc(0,-212,31,Math.PI,TAU);ctx.fill();ctx.fillStyle='#1e3a8a';ctx.beginPath();ctx.ellipse(24,-212,25,5,0,0,TAU);ctx.fill();ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(6,-226,5,0,TAU);ctx.fill()}
  if(o.rage){const hc=o.hair||'#b45309';ctx.strokeStyle=hc;ctx.lineWidth=3;for(let i=0;i<9;i++){const a=-Math.PI*(.1+.8*i/8),u=((t*1.1+i*.37)%1),r0=31,r1=r0+8+u*70;ctx.globalAlpha=(1-u)*o.rage;ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,-188+Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*r1+Math.sin(u*9+i)*6,-188+Math.sin(a)*r1);ctx.stroke()}
    ctx.fillStyle='#38bdf8';for(let i=0;i<3;i++){const u=((t*.9+i*.33)%1);ctx.globalAlpha=(1-u)*o.rage;ctx.beginPath();ctx.ellipse(i%2?40:-40,-190+u*40,3.5,5.5,0,0,TAU);ctx.fill()}ctx.globalAlpha=1}
  ctx.restore()}
function oBush(x,y,s){ctx.fillStyle='#4d7c0f';[[-70,-40,62,46],[0,-58,78,58],[70,-38,60,44],[-30,-20,70,34],[34,-18,70,34]].forEach(q=>{ctx.beginPath();ctx.ellipse(x+q[0]*s*K,y+q[1]*s*K,q[2]*s*K,q[3]*s*K,0,0,TAU);ctx.fill()});ctx.strokeStyle='#365314';ctx.lineWidth=2;ctx.stroke()}
function oTitleCard(st,a,b){const ca=st<3.4?Math.min(1,st*3):Math.max(0,1-(st-3.4)/.9);if(ca<=0)return;ctx.globalAlpha=ca;ctx.fillStyle='#f6f1e7';ctx.fillRect(0,0,W,H);
  oLab('СЕКРЕТНІ МАТЕРІАЛИ',W/2,H*.36,OK,54,ca);oLab('ДИСКРЕТНОЇ МАТЕМАТИКИ',W/2,H*.47,OR,54,ca);ctx.strokeStyle=OR;ctx.lineWidth=3*K;ctx.beginPath();ctx.moveTo(W*.3,H*.51);ctx.lineTo(W*.7,H*.51);ctx.stroke();
  oLab(a,W/2,H*.62,OK,28,ca);oLab(b,W/2,H*.69,'#6b5d4f',22,ca);ctx.globalAlpha=1}

/* ===== ПЕРСОНАЖІ ===== */
const AL={coat:'#ec4899',dress:1,long:1,hair:'#7c2d12'},BO={coat:'#2563eb',tie:1,suit:1,hair:'#1f2937'},EV={coat:'#475569',cap:1,bag:1,hair:'#b45309'},

  if(isPlaying&&!isPaused)speakScene()});
speedSel.onchange=()=>{speed=parseFloat(speedSel.value);if(gAudio){try{gAudio.playbackRate=speed}catch(e){}}};
chkSubs.onchange=()=>{if(!chkSubs.checked)subtitleEl.style.opacity='0';
  else setSubtitle(scenes[currentScene])};
chkDebug.onchange=()=>{debugSection.style.display=chkDebug.checked?'block':'none'};
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.closest&&e.target.closest('#gameLayer'))return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.code==='ArrowRight')seekScene(currentScene+1);
  else if(e.code==='ArrowLeft')seekScene(currentScene-1);
  else if(e.code==='KeyR')stopShow()});
canvas.addEventListener('click',()=>{if(!hasStarted)startShow()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lastTs=performance.now()});

/* ================= ЗАСІЧКИ / ТРАНСКРИПТ ================= */
const tickEls=[];
scenes.forEach((sc,i)=>{const t=document.createElement('div');t.className='tick';
  t.style.left=(cum[i]/TOTAL*100)+'%';t.title=(i+1)+'. '+sc.tick+' ('+sc.dur+' с)';
  t.onclick=e=>{e.stopPropagation();seekScene(i)};ticksLayer.appendChild(t);tickEls.push(t);
  const l=document.createElement('div');l.className='tick-label';l.style.left=(cum[i]/TOTAL*100)+'%';
  l.textContent=sc.tick;ticksLayer.appendChild(l)});
function updateLabelsVis(){ticksLayer.querySelectorAll('.tick-label').forEach(l=>
  l.style.display=chkLabels.checked?'':'none')}
chkLabels.onchange=updateLabelsVis;updateLabelsVis();
scenes.forEach((sc,i)=>{const b=document.createElement('button'),hd=document.createElement('b'),tx=document.createElement('span');
  hd.textContent=(i+1)+'. '+fmt(cum[i])+' · '+sc.tick;tx.textContent=sc.text;b.appendChild(hd);b.appendChild(tx);
  b.onclick=()=>seekScene(i);sceneListEl.appendChild(b)});
function updateSceneButtons(){Game.setVisible(false);
  sceneListEl.querySelectorAll('button').forEach((b,i)=>
  b.classList.toggle('active',i===currentScene));
  sceneIndicator.textContent=(currentScene+1)+'/'+scenes.length+' · '+scenes[currentScene].tick}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function updateHud(){const sc=scenes[currentScene];
  const cur=cum[currentScene]+Math.min(sceneTime,sc.dur);
  progressFill.style.width=(cur/TOTAL*100)+'%';
  timeDisp.textContent=fmt(cur)+' / '+fmt(TOTAL);
  tickEls.forEach((t,i)=>t.classList.toggle('active',i===currentScene));
  voiceState.textContent=(engine==='none'?'🔇':(ttsActive?'🔊':'🔈'))+(hfMsg?' '+hfMsg:'');
  voiceState.classList.toggle('active',ttsActive)}
updateSceneButtons();

/* ================= ГОЛОВНИЙ ЦИКЛ ================= */
let lastTs=performance.now();
function overlayStart(){ctx.fillStyle='rgba(8,12,26,.55)';ctx.fillRect(0,0,W,H);
  const pu=1+0.05*Math.sin(performance.now()/300);
  ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(pu,pu);
  ctx.beginPath();ctx.arc(0,0,54,0,TAU);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();
  ctx.strokeStyle='#e11d48';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-14,-22);ctx.lineTo(-14,22);ctx.lineTo(24,0);ctx.closePath();
  ctx.fillStyle='#e11d48';ctx.fill();ctx.restore();
  fnt(22,true);ctx.fillStyle='#fff';txt('Натисніть, щоб дивитись з озвученням',W/2,H/2+70);
  fnt(15);ctx.fillStyle='rgba(255,255,255,.85)';
  txt('Space — пауза · ←/→ — сцени · клік по шкалі — перемотка',W/2,H/2+102)}

function frame(ts){const rawDt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(isPlaying&&!isPaused&&!(engine==='hf'&&hfWait)){const dt=rawDt*speed;globalTime+=dt;sceneTime+=dt;
    const sc=scenes[currentScene];
    const animDone=sceneTime>=sc.dur;
    const voiceOK=engine==='none'||ttsDone||sceneTime>sc.dur+(engine==='webspeech'?30:60);
    if(animDone&&voiceOK){holdTimer+=dt;
      if(holdTimer>=0.7){
        if(currentScene<scenes.length-1)startScene(currentScene+1);
        else{finished=true;isPlaying=false;isPaused=false;setPlayIcon(false);stopSpeaking()}}}
    else holdTimer=0}
  gtNow=globalTime; /* критично: мерехтіння, курсор, пунктири */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fbf7f0');g.addColorStop(1,'#f2ebdd');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  scenes[currentScene].draw(W,H,sceneTime,globalTime);
  const f=1-stag(sceneTime,0,0.45);
  if(f>0&&hasStarted){ctx.fillStyle='rgba(251,247,240,'+f*0.6+')';ctx.fillRect(0,0,W,H)}
  if(hasStarted&&engine==='hf'&&hfWait){ctx.fillStyle='rgba(30,30,30,.75)';ctx.font='bold 16px Arial';ctx.textAlign='left';ctx.fillText('Готую озвучення…',16,H-16)}
  if(!hasStarted)overlayStart();
  updateHud();
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
